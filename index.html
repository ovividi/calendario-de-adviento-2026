  <style>
    :root {
      --crema: #f6efe2;
      --crema-oscuro: #dfcaa5;
      --cremaA: #ab8f5f;
      --rojo: #8a2b28;
      --rojo-oscuro: #790e0b;
      --verde: #0b8d4a;
      --verde-oscuro: #113824;
      --dorado: #dfb013;
      --madera: #5d2803;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Corben', Corben, serif;
      background-image: url("fondo.jpg");
      background-size: cover;        /* Ajusta la imagen para cubrir toda la pantalla sin deformarse */
      background-position: center;   /* Centra la imagen */
      background-attachment: fixed;  /* Mantiene el fondo quieto al hacer scroll hacia abajo */
      background-repeat: no-repeat;  /* Evita que la foto se repita en mosaico */
      color: var(--verde-oscuro);
      margin: 0;
      padding: 20px 10px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      font-family: 'Corben', serif;
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      color: #1b5336;
      margin: 0 0 6px 0;
      letter-spacing: 1px;
    }

    header p {
      margin: 0;
      font-style: italic;
      color: #6a0606;
    }

    /* ==========================================================
       ESTRUCTURA DEL ÁRBOL DE NAVIDAD
       ========================================================== */
    .arbol-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 720px;
      margin-top: 10px;
    }

    /* Estrella dorada superior */
    .estrella-punta {
  width: 96px;
  height: 96px;
  background: linear-gradient(135deg, #f5d76e, #d4af37, #aa821c);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin-bottom: -24px;
  z-index: 6;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
  transition: transform 0.25s ease;
}

.estrella-punta:hover {
  transform: scale(1.12);
}

.estrella-punta span {
  font-family: 'Corben', serif;
  font-weight: 900;
  font-size: 1.45rem;
  color: var(--rojo-oscuro);
  margin-top: 8px;
}

.estrella-punta.abierta {
  filter: sepia(0.35) brightness(0.92) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
}

    @keyframes brilloEstrella {
      from { transform: scale(1) rotate(-3deg); }
      to { transform: scale(1.06) rotate(3deg); }
    }

    /* Silueta verde del árbol detrás de las casillas */
    .cuerpo-arbol {
      position: relative;
      width: 100%;
      padding: 38px 16px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 2;
    }

    /* Fondo verde con forma de pino escalonado */
    .cuerpo-arbol::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #215e3e 0%, #16442c 100%);
      clip-path: polygon(
        50% 0%,
        72% 16%, 64% 16%,
        82% 33%, 73% 33%,
        90% 52%, 81% 52%,
        96% 72%, 87% 72%,
        100% 94%, 0% 94%,
        13% 72%, 4% 72%,
        19% 52%, 10% 52%,
        27% 33%, 18% 33%,
        36% 16%, 28% 16%
      );
      z-index: -1;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.22));
    }

    /* Cada fila horizontal del árbol */
    .fila-arbol {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, 2vw, 18px);
      width: 100%;
    }


    /* Tronco inferior del árbol */
    .tronco-arbol {
      width: 90px;
      height: 95px; /* Más alto para que siga viéndose largo por debajo */
      background: linear-gradient(90deg, #472b17, #6b4427, #472b17);
      border-radius: 0 0 8px 8px;
      margin-top: -55px; /* Sube el tronco para que quede metido detrás de la base del árbol */
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
      z-index: 1;
    }
    /* ==========================================================
       ESTILO BASE DE CADA ETIQUETA / CASILLA
       ========================================================== */
   /* Estilo base de cada bola de Navidad */
    .casilla {
      width: clamp(60px, 14vw, 96px);
      height: clamp(60px, 14vw, 96px); /* Mismo ancho y alto para que sea un círculo perfecto */
      border-radius: 50% !important;    /* Fuerza la forma redonda en todos los estilos */
      clip-path: none !important;       /* Quita los recortes octogonales antiguos */
      background-color: var(--crema);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      position: relative;
      margin-top: 12px;                 /* Deja espacio arriba para el enganche de la bola */
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      box-shadow: inset -6px -8px 14px rgba(0, 0, 0, 0.22), 
                  inset 5px 5px 10px rgba(218, 152, 44, 0.65),
                  0 6px 12px rgba(0, 0, 0, 0.38);
      overflow: visible;                /* Permite que se vea el capuchón dorado por fuera */
    }

    /* Capuchón metálico dorado e hilo superior de cada bola */
    .casilla::before {
      content: "";
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 11px;
      background: linear-gradient(90deg, #9e7b18, #f5d76e, #9e7b18);
      border-radius: 3px 3px 0 0;
      box-shadow: 0 -6px 0 -6px var(--dorado), 0 -7px 0 -6px var(--dorado);
      z-index: 3;
    }

    .casilla:hover {
      transform: scale(1.1) rotate(0deg) !important;
      z-index: 10;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45);
    }

    .casilla .numero {
      font-size: clamp(1.4rem, 3.5vw, 2.3rem);
      line-height: 1;
      z-index: 2;
    }

    /* Estado cuando la casilla ya fue abierta */
    .casilla.abierta {
      filter: sepia(0.35) brightness(0.92);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.35);
    }

    .casilla.abierta::after {
      content: "✓";
      position: absolute;
      bottom: 3px;
      right: 5px;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--verde-oscuro);
      background: var(--crema-oscuro);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

   /* ==========================================================
       ESTILO BASE ILUSTRADO PARA TODAS LAS BOLAS
       ========================================================== */
    .casilla {
      width: clamp(46px, 13.5vw, 94px);
      height: clamp(46px, 13.5vw, 94px);
      border-radius: 50% !important;
      clip-path: none !important;

      overflow: visible;
    }

    .casilla:hover:not(.bloqueada) {
      transform: scale(1.08) rotate(-2deg);
    }

    /* Capuchón superior estilo dibujo con anilla */
    .casilla::before {

    }

    }

    /* Capuchón metálico dorado con anilla superior */

    /* ==========================================================
       ESTAMPADOS Y TIPOGRAFÍAS ÚNICAS DEL 1 AL 24
       ========================================================== */

    /* 1: Roja con lunares dorados (como la 1ª de la imagen) */
    .estilo-1 {
      background-color: #a62c21;
      background-image: radial-gradient(#e5bc63 1.8px, transparent 1.8px), radial-gradient(#e5bc63 1.8px, #a62c21 1.8px);
      background-size: 22px 22px;
      background-position: 0 0, 11px 11px;
      font-family: 'Alfa Slab One', serif;
    }
    .estilo-1::before { background-color: #2c5e3b; }
    .estilo-1 .numero {
      color: #ffffff;
      text-shadow: -1.5px -1.5px 0 #7a0618, 1.5px -1.5px 0 #7a0618, -1.5px 1.5px 0 #7a0618, 1.5px 1.5px 0 #7a0618;
    }

    /* 2: Verde con ondas doradas y lazo rojo arriba */
    .estilo-2 {
      background-color: #2c5e3b;
      background-image: repeating-radial-gradient(circle at 50% -20%, transparent 0, transparent 12px, #e5bc63 13px, #e5bc63 15px, transparent 16px);
      font-family: 'Cinzel', serif;
      font-weight: 900;
    }
    .estilo-2::before {
      width: 34px; height: 11px; top: -11px;
      background: linear-gradient(90deg, #a62c21 42%, #1b1918 43%, #1b1918 57%, #a62c21 58%);
      border-radius: 4px;
    }
    .estilo-2 .numero {
      color: #ffd166;
      text-shadow: -1.5px -1.5px 0 #7a0618, 1.5px -1.5px 0 #7a0618, -1.5px 1.5px 0 #7a0618, 1.5px 1.5px 0 #7a0618;
    }

    /* 3: Roja con franja central dorada y crema */
    .estilo-3 {
      background: linear-gradient(165deg, #a62c21 36%, #e5bc63 37%, #e5bc63 43%, #fdf6e7 44%, #fdf6e7 56%, #e5bc63 57%, #e5bc63 63%, #a62c21 64%);
      font-family: 'Playfair Display', serif;
      font-style: bold;
      font-weight: 900;
    }
    .estilo-3 .numero {
      color: #163a52;
      text-shadow: -1.5px -1.5px 0 #eef6fa, 1.5px -1.5px 0 #eef6fa, -1.5px 1.5px 0 #eef6fa, 1.5px 1.5px 0 #eef6fa, 0 2.5px 0 rgba(255,255,255,0.8);
    }

    /* 4: Remolino caramelo rojo, dorado y crema (como la 7ª de la imagen) */
    .estilo-4 {
      background: repeating-conic-gradient(#a62c21 0deg 30deg, #e5bc63 30deg 34deg, #fdf6e7 34deg 56deg, #e5bc63 56deg 60deg);
      font-family: 'Rye', serif;
    }
    .estilo-4::before { background-color: #fdf6e7; }
    .estilo-4 .numero {

    }

    /* 5: Verde con rayas diagonales doradas (como la 4ª de la imagen) */

      font-family: 'Corben', serif;

    }

    }

    /* 6: Roja y verde dividida con banda dorada (como la 5ª de la imagen) */

      background: linear-gradient(180deg, #a62c21 62%, #e5bc63 63%, #e5bc63 70%, #2c5e3b 71%);
      font-family: 'Special Elite', monospace;
    }
    .estilo-6::before { background-color: #fdf6e7; }

      background-color: #2c5e3b;
      background-image:

    .estilo-24 {

    }

      

    /* ==========================================================
       VENTANA EMERGENTE (MODAL)
       ========================================================== */
    .modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 36, 24, 0.72);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(2px);
    }

    .modal-caja {
      background: var(--crema);
      padding: 32px 26px;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      text-align: center;
      border: 4px double var(--rojo);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      animation: aparecer 0.25s ease-out;
    }

    @keyframes aparecer {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-caja h2 {
      font-family: 'Corben', serif;
      color: var(--rojo);
      margin-top: 0;
    }

    
    .modal-caja img {
      max-width: 100%;
      max-height: 55vh;          /* Evita que fotos muy verticales ocupen toda la pantalla */
      object-fit: contain;       /* Mantiene la proporción original de la foto sin recortarla */
      border-radius: 8px;
      border: 2px solid var(--dorado);
      margin: 12px 0;
    }

    .boton-cerrar {
      margin-top: 18px;
      background-color: var(--verde);
      color: var(--crema);
      border: 2px solid var(--dorado);
      padding: 10px 26px;
      border-radius: 8px;
      font-family: 'Corben', serif;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .boton-cerrar:hover {
      background-color: var(--verde-oscuro);
    }

    .controles-pie {
      margin-top: 35px;
    }

    .controles-pie button {
      background: rgba(255,255,255,0.7);
      border: 1px solid #b5a895;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      color: #5c5346;
      font-size: 0.8rem;
    }
    /* Selector de vista de pantalla */
    .selector-vista {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 10px auto 15px;
      flex-wrap: wrap;
    }

    .selector-vista button {
      background-color: var(--crema);
      color: var(--verde-oscuro);
      border: 2px solid var(--verde);
      padding: 6px 12px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .selector-vista button.activo,
    .selector-vista button:hover {
      background-color: var(--verde);
      color: var(--crema);
    }

    /* Modos forzados desde el botón */
    body.vista-tablet .arbol-wrapper { max-width: 650px; }
    body.vista-movil .arbol-wrapper { max-width: 370px; }

    /* Estilos compactos para pantalla móvil (automático o con botón) */
    @media (max-width: 520px) {
      body { padding: 15px 6px 40px; }
      .estrella-punta { width: 72px; height: 72px; margin-bottom: -18px; }
      .estrella-punta span { font-size: 1.15rem; }
      .cuerpo-arbol { padding: 28px 8px 24px; gap: 10px; }
      .casilla { margin-top: 8px; border-width: 3px !important; }
      .casilla::before { top: -8px; width: 12px; height: 8px; }
      .tronco-arbol { width: 65px; height: 60px; margin-top: -32px; }
      .modal-caja { padding: 22px 16px; max-height: 82vh; }
    }

    body.vista-movil .estrella-punta { width: 72px; height: 72px; margin-bottom: -18px; }
    body.vista-movil .estrella-punta span { font-size: 1.15rem; }
    body.vista-movil .cuerpo-arbol { padding: 28px 8px 24px; gap: 10px; }
    body.vista-movil .casilla { width: 46px; height: 46px; margin-top: 8px; border-width: 3px !important; }
    body.vista-movil .casilla .numero { font-size: 1.1rem; }
    body.vista-movil .casilla::before { top: -8px; width: 12px; height: 8px; }
    body.vista-movil .tronco-arbol { width: 65px; height: 60px; margin-top: -32px; }

  </style>

<body>

    <button id="btn-movil" onclick="cambiarVista('movil')">📲 Móvil</button>
  </div>
    <h1>Feliz Navidad. Te quiero mucho <3 </h1>
    <p>Abre una bolica cada día hasta Navidad</p>
  </header>

  <!-- ÁRBOL DE NAVIDAD CON LAS 25 CASILLAS -->
  <div class="arbol-wrapper">
    <div class="estrella-punta" id="estrella-25"><span>25</span></div>
    <main class="cuerpo-arbol" id="contenedor-arbol"></main>
    <div class="tronco-arbol"></div>
  </div>

  <!-- VENTANA EMERGENTE CON TU SORPRESA -->
  <div class="modal-fondo" id="modal">
    <div class="modal-caja">
      <h2 id="modal-titulo">Día X</h2>
      <p id="modal-texto">Contenido del día...</p>
      <div id="modal-extra"></div>
      <button class="boton-cerrar" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <div class="controles-pie">
    <button onclick="reiniciarProgreso()">Cerrar casillas abiertas (modo prueba)</button>
  </div>

      
  <script>
    /* ==========================================================
       1. CONFIGURACIÓN Y SORPRESAS DE LOS 24 DÍAS
       Edita aquí tus textos, fotos o enlaces
       ========================================================== */
    const BLOQUEAR_POR_FECHA_REAL = false ; // Cambia a "true" cuando lo termines de diseñar

    const sorpresas = [
      { dia: 1,  titulo: "Día de explicación", texto: "Cada día encontrarás la expliación del día que es (la más absurda de encuentre) acompañada de una foto y un mensajico. T quiero mucho <3 Nos vemos mañana" },
      { dia: 2,  titulo: "Día Internacional para la Abolición de la Esclavitud", texto: "mamma" , imagen: "foto2.JPEG" },
      { dia: 3,  titulo: "Día del Cine 3D", texto: "Sube el volumen y escucha nuestra canción navideña favorita.", imagen: "foto3.JPEG" },
      { dia: 4,  titulo: "Día del Guepardo", texto: "Escribe aquí tu sorpresa para el día 4." , imagen: "foto4.JPEG" },
      { dia: 5,  titulo: "Día Mundial del Suelo", texto: "Escribe aquí tu sorpresa para el día 5." , imagen: "foto5.JPEG" },
      { dia: 6,  titulo: "Día de la Constitución", texto: "Escribe aquí tu sorpresa para el día 6." , imagen: "foto6.JPEG" },
      { dia: 7,  titulo: "Día de las Velitas", texto: "Escribe aquí tu sorpresa para el día 7." , imagen: "foto7.JPEG" },
      { dia: 8,  titulo: "Día de la Virgen", texto: "Escribe aquí tu sorpresa para el día 8." , imagen: "foto8.JPEG" },
      { dia: 9,  titulo: "Día Internacional contra la Corrupción", texto: "Escribe aquí tu sorpresa para el día 9." , imagen: "foto9.JPEG" },
      { dia: 10, titulo: "Día del Trabajador Social (Pilar es eso)", texto: "Escribe aquí tu sorpresa para el día 10." , imagen: "foto10.JPEG"},
      { dia: 11, titulo: "Día Internacional de las Montañas", texto: "Escribe aquí tu sorpresa para el día 11." , imagen: "foto11.JPEG"},
      { dia: 12, titulo: "Día Internacional de la Cobertura", texto: "¡Ya llevamos 12 días! Hoy toca paseo para ver las luces de Navidad.", imagen: "foto12.JPEG" },
      { dia: 13, titulo: "Día Internacional del Canto Coral", texto: "Escribe aquí tu sorpresa para el día 13." , imagen: "foto13.JPEG" },
      { dia: 14, titulo: "Día Mundial del Mono (tu día)", texto: "Escribe aquí tu sorpresa para el día 14." , imagen: "foto14.JPEG" },
      { dia: 15, titulo: "Día Mundial del Otaku (ugh)", texto: "Escribe aquí tu sorpresa para el día 15." , imagen: "foto15.JPEG" },
      { dia: 16, titulo: "Día del nacimiento de Beethoven", texto: "Escribe aquí tu sorpresa para el día 16." , imagen: "foto16.JPEG" },
      { dia: 17, titulo: "Hoy no hay día de nada :(", texto: "Escribe aquí tu sorpresa para el día 17." , imagen: "foto17.JPEG" },
      { dia: 18, titulo: "Día del Jersey Navideño Feo", texto: "Escribe aquí tu sorpresa para el día 18." , imagen: "foto18.JPEG" },
      { dia: 19, titulo: "Día Internacional del Emo", texto: "Escribe aquí tu sorpresa para el día 19." , imagen: "foto19.JPEG" },
      { dia: 20, titulo: "Día de las Migas", texto: "Escribe aquí tu sorpresa para el día 20." , imagen: "foto20.JPEG" },
      { dia: 21, titulo: "Día del solsticio de invierno", texto: "Escribe aquí tu sorpresa para el día 21." , imagen: "foto21.png" },
      { dia: 22, titulo: "Día Mundial del Termómetro", texto: "Escribe aquí tu sorpresa para el día 22." , imagen: "foto22.JPEG" },
      { dia: 23, titulo: "Víspera de Nochebuena", texto: "Prepara el gorro de Papá Noel, ¡mañana es el gran día!" , imagen: "foto23.JPEG" },
      { dia: 24, titulo: "Día de Nochebuena!", texto: " hh" , imagen: "foto24.png" },
      { dia: 25, titulo: "Día de Navidad", texto: "Hoy si hay sopresa🫢 Ya puedes abrirlo (si no lo habías hecho ya...). Y esta foto es una pista!!", imagen: "foto25.jpg" }
  ]

    /* ==========================================================
       2. ESTRUCTURA DE FILAS DEL ÁRBOL (Igual que en la foto)
       Fila 1: 1 casilla | Fila 2: 2 casillas ... Fila 7: 4 casillas
       ========================================================== */
    const estructuraFilasArbol = [1, 2, 3, 4, 5, 5, 4]; // Suma = 24 casillas

    const contenedorArbol = document.getElementById("contenedor-arbol");
    let puertasAbiertas = JSON.parse(localStorage.getItem("adviento_arbol_abiertas")) || [];

    function dibujarArbol() {
      contenedorArbol.innerHTML = "";
      let indiceSorpresa = 0;

      // Bucle externo: recorre cada piso/fila del árbol
      for (let fila = 0; fila < estructuraFilasArbol.length; fila++) {
        const divFila = document.createElement("div");
        divFila.className = "fila-arbol";

        const cantidadEnEstaFila = estructuraFilasArbol[fila];

        // Bucle interno: coloca las etiquetas correspondientes a esa fila
        for (let col = 0; col < cantidadEnEstaFila; col++) {
          if (indiceSorpresa >= sorpresas.length) break;

          const item = sorpresas[indiceSorpresa];
          const estaAbierta = puertasAbiertas.includes(item.dia);

          const casilla = document.createElement("div");
          // Aplica su estilo vintage único (estilo-1 hasta estilo-24)
          casilla.className = `casilla estilo-${item.dia}` + (estaAbierta ? " abierta" : "");
          casilla.innerHTML = `<span class="numero">${item.dia}</span>`;
          casilla.onclick = () => intentarAbrirCasilla(item);

          divFila.appendChild(casilla);
          indiceSorpresa++;
          // Conectar la estrella con el día 25
      const sorpresa25 = sorpresas.find(s => s.dia === 25);
      const estrella = document.getElementById("estrella-25");
      if (sorpresa25 && estrella) {
        estrella.classList.toggle("abierta", puertasAbiertas.includes(25));
        estrella.onclick = () => intentarAbrirCasilla(sorpresa25);
      }
        }

        contenedorArbol.appendChild(divFila);
      }
    }

    function intentarAbrirCasilla(item) {
      if (BLOQUEAR_POR_FECHA_REAL) {
        const hoy = new Date();
        const mes = hoy.getMonth(); // Diciembre es el mes 11 (empieza en 0)
        const diaHoy = hoy.getDate();

        if (mes !== 11 || diaHoy < item.dia) {
          mostrarModal({
            dia: item.dia,
            titulo: "🔒 Bloqueat",
            texto: `Ten pacienciaa! Se desbloqueará el ${item.dia} de diciembre.`
          });
          return;
        }
      }

      if (!puertasAbiertas.includes(item.dia)) {
        puertasAbiertas.push(item.dia);
        localStorage.setItem("adviento_arbol_abiertas", JSON.stringify(puertasAbiertas));
        dibujarArbol();
      }

      mostrarModal(item);
    }

    function mostrarModal(item) {
      document.getElementById("modal-titulo").innerText = `Día ${item.dia} — ${item.titulo}`;
      document.getElementById("modal-texto").innerText = item.texto;

      const extra = document.getElementById("modal-extra");
      extra.innerHTML = "";

      if (item.imagen) {
        extra.innerHTML += `<img src="${item.imagen}" alt="Sorpresa día ${item.dia}">`;
      }

      if (item.enlace) {
        extra.innerHTML += `<p><a href="${item.enlace}" target="_blank" style="color: #b82925; font-weight: bold;">🎁 Abrir enlace sorpresa</a></p>`;
      }

      document.getElementById("modal").style.display = "flex";
    }

    function cerrarModal() {
      document.getElementById("modal").style.display = "none";
    }

    function reiniciarProgreso() {
      localStorage.removeItem("adviento_arbol_abiertas");
      puertasAbiertas = [];
      dibujarArbol();
    }

    dibujarArbol();

    function cambiarVista(modo) {
      document.body.classList.remove('vista-tablet', 'vista-movil');
      document.querySelectorAll('.selector-vista button').forEach(b => b.classList.remove('activo'));

      if (modo === 'tablet') {
        document.body.classList.add('vista-tablet');
        document.getElementById('btn-tablet').classList.add('activo');
      } else if (modo === 'movil') {
        document.body.classList.add('vista-movil');
        document.getElementById('btn-movil').classList.add('activo');
      } else {
        document.getElementById('btn-pc').classList.add('activo');
      }
    }
  </script>
</body>
</html>
